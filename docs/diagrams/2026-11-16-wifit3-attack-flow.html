<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>从设备发现到 campaign 判定的全流程</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f7f5f0;
    --color-ink:    #1b2432;
    --color-muted:  #4a5a72;
    --color-accent: #1f5fa8;
    --color-rule:   rgba(27,36,50,0.12);
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  html, body { background: var(--color-paper); }
  body {
    font-family: var(--font-sans); color: var(--color-ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1344px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.02em;
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); line-height: 1.15;
    color: var(--color-ink); margin-bottom: 1.5rem;
  }
  .diagram-container { width: 100%; overflow-x: auto; }
  svg { width: 100%; min-width: 1280px; display: block; }
  .note {
    font-family: var(--font-mono); font-size: 0.66rem; color: var(--color-muted);
    margin-top: 1rem; line-height: 1.7;
  }
  @media print {
    .diagram-container { overflow-x: visible; }
    svg { min-width: 0; }
  }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Data flow · WiFit3</p>

      <text x="392" y="482" fill="#5f7089" font-size="10.5" font-family="Geist Mono, monospace">pin / wps / pmkid / wep</text>

      <text x="112" y="680" fill="#4a5a72" font-size="10.5" font-family="Geist Mono, monospace">层 / 模块</text>
      <rect x="224" y="669" width="14" height="14" rx="3" fill="rgba(31,95,168,0.08)" stroke="#1f5fa8" stroke-width="0.8"/>
      <text x="248" y="680" fill="#4a5a72" font-size="10.5" font-family="Geist Mono, monospace">焦点：核心缝合层</text>
      <line x1="384" y1="676" x2="412" y2="676" stroke="#4a5a72" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="422" y="680" fill="#4a5a72" font-size="10.5" font-family="Geist Mono, monospace">主链路</text>
    </svg>
  </div>
  <p class="note">链路 ACK 回路即为本次修复点：虚拟适配器此前不应答 ACK，导致 deauth 在仿真中恒报双方静默。</p>
</div>
</body>
</html>
